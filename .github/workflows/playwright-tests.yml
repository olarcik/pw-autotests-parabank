name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check and format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Format check
        run: npm run format:check

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Passed into the playwright-tests container by docker-compose.yml; BASE_URL is set there to the parabank service.
    env:
      ENV: ${{ vars.ENV || 'dev' }}
      TENANT: ${{ vars.TENANT || 'parabank' }}
      # Qase is opt-in: results are sent only when QASE_MODE=testops and both the project and the token
      # are configured (secrets are not available, e.g., to PRs from forks). Anything else runs with "off".
      QASE_MODE: ${{ vars.QASE_MODE == 'testops' && vars.QASE_TESTOPS_PROJECT != '' && secrets.QASE_TESTOPS_API_TOKEN != '' && 'testops' || 'off' }}
      QASE_TESTOPS_PROJECT: ${{ vars.QASE_TESTOPS_PROJECT }}
      QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
      QASE_TESTOPS_RUN_TITLE: GitHub Actions #${{ github.run_number }} (${{ github.ref_name }})
    steps:
      - uses: actions/checkout@v7
      # Same command as locally: builds the test image, starts ParaBank, runs the suite, cleans up.
      - name: Run Playwright tests
        run: npm run docker:test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
