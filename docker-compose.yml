services:
  parabank:
    # parasoft/parabank:latest, pinned by digest so every run uses the same build.
    # To update: docker pull parasoft/parabank:latest, then copy the new digest from
    # docker inspect --format "{{index .RepoDigests 0}}" parasoft/parabank:latest
    image: parasoft/parabank@sha256:0de7bbc8eb0f7ba61579421df1fc834fd7f559c08bf295597c0f9081e0a906e9
    # Host port is configurable (PARABANK_PORT in .env) in case 8080 is taken on the host.
    # The container port stays 8080; the playwright-tests service and the healthcheck use it directly.
    ports:
      - '${PARABANK_PORT:-8080}:8080'
    # The image has no curl or wget, so the check sends raw HTTP requests through bash's /dev/tcp.
    # A fresh container redirects every page to initializeDB.htm until the database is created;
    # the check calls it once in that case, so `docker compose up --wait` returns a ready app.
    # It never calls it on an initialized app, because that would reset the data.
    # ($$ escapes $ from Compose variable interpolation.)
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          get() { exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET %s HTTP/1.0\r\nHost: localhost\r\n\r\n' "$$1" >&3 && head -n 20 <&3; }
          resp=$$(get /parabank/index.htm) || exit 1
          echo "$$resp" | head -n 1 | grep -q ' 200 ' && exit 0
          echo "$$resp" | grep -qi '^Location:.*initializeDB' && get /parabank/initializeDB.htm > /dev/null
          exit 1
      start_period: 120s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  # Playwright tests (see Dockerfile). Started only with `--profile tests`, e.g. `npm run docker:test`.
  playwright-tests:
    profiles: [tests]
    build: .
    depends_on:
      parabank:
        condition: service_healthy
    # Recommended by Playwright for Docker: init reaps browser child processes,
    # ipc: host gives Chromium enough shared memory so it doesn't crash.
    init: true
    ipc: host
    environment:
      # Inside the Compose network `localhost` is the playwright-tests container itself; the app is
      # reached by its service name on the container port, independent of the published host port.
      BASE_URL: http://parabank:8080/parabank
      # The rest is taken from the shell or .env (locally) and from the job env (CI); unset stays empty.
      CI: ${CI:-}
      ENV: ${ENV:-dev}
      TENANT: ${TENANT:-parabank}
      QASE_MODE: ${QASE_MODE:-off}
      QASE_TESTOPS_PROJECT: ${QASE_TESTOPS_PROJECT:-}
      QASE_TESTOPS_API_TOKEN: ${QASE_TESTOPS_API_TOKEN:-}
      QASE_TESTOPS_RUN_TITLE: ${QASE_TESTOPS_RUN_TITLE:-}
    # Reports are written to the host, so they are available after the container is removed.
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
