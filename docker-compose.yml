services:
  parabank:
    # parasoft/parabank:latest, pinned by digest so every run uses the same build.
    # To update: docker pull parasoft/parabank:latest, then copy the new digest from
    # docker inspect --format "{{index .RepoDigests 0}}" parasoft/parabank:latest
    image: parasoft/parabank@sha256:0de7bbc8eb0f7ba61579421df1fc834fd7f559c08bf295597c0f9081e0a906e9
    ports:
      - "8080:8080"
    # The image has no curl or wget, so the check sends raw HTTP requests through bash's /dev/tcp.
    # A fresh container redirects every page to initializeDB.htm until the database is created;
    # the check calls it once in that case, so `docker compose up --wait` returns a ready app.
    # It never calls it on an initialized app, because that would reset the data.
    # ($$ escapes $ from Compose variable interpolation.)
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          get() { exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET %s HTTP/1.0\r\nHost: localhost\r\n\r\n' "$$1" >&3 && head -n 20 <&3; }
          resp=$$(get /parabank/index.htm) || exit 1
          echo "$$resp" | head -n 1 | grep -q ' 200 ' && exit 0
          echo "$$resp" | grep -qi '^Location:.*initializeDB' && get /parabank/initializeDB.htm > /dev/null
          exit 1
      start_period: 120s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3
